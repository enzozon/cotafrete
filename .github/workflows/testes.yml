name: testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mesmo sistema e Python da VM (Windows, 3.14): alguns testes só rodam no Windows.
  # A suíte vai em duas metades ao mesmo tempo, cada uma numa máquina; elas
  # medem quase o mesmo (~3 min cada com -n 4). A marcação `navegador` é a do
  # tests/conftest.py, então um teste novo cai sozinho na metade certa.
  testes:
    name: testes (${{ matrix.grupo }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        grupo: [navegador, not navegador]
    steps:
      - run: tzutil /s "E. South America Standard Time"  # fuso da VM
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      # selenium: robô da HSE (cruzar_nf). pytest-xdist: o -n 4 abaixo.
      - run: pip install -r requirements.txt selenium pytest-xdist
      - if: matrix.grupo == 'navegador'
        run: python -m playwright install chromium
      # 4 processos = 4 vCPU do windows-latest. No PC do Enzo o padrão é em série.
      - run: python -m pytest tests -q -n 4 -m "${{ matrix.grupo }}"

  # É este o nome que a proteção da main exige: passa só com as duas metades
  # verdes. `always()` porque um job pulado conta como aprovado.
  cotafrete:
    needs: testes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.testes.result }}" = success

  # cruzar_nf roda no Server 2012 R2, que só tem Python 3.8.
  cruzar-nf-py38:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.8"
      - run: pip install openpyxl python-dotenv pytest
      - run: >
          python -m pytest -q
          tests/test_cruzar_nf.py tests/test_conferir.py tests/test_nf_planilha.py
          tests/test_painel_nf.py tests/test_planilha_portal.py tests/test_sync_planilha_portal.py
